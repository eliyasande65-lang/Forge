name: Build CodeForge APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev

      - name: Install Buildozer
        run: pip install buildozer==1.5.0 cython==0.29.37 virtualenv

      - name: Build APK (arm64-v8a + armeabi-v7a)
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        run: |
          grep -n -i -E "error|failed|exception" build.log | tail -n 60 || true
          tail -n 80 build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: codeforge-apk
          path: bin/*.apk
